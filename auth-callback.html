<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Catown Map</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e0f2f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .card {
    max-width: 360px;
    width: calc(100% - 48px);
    margin: 24px;
    padding: 32px 24px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    text-align: center;
  }
  .emoji { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 8px 0 4px; color: #00332e; }
  p { font-size: 14px; color: #4a5a58; line-height: 1.6; }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 28px;
    background: #00897b;
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  .btn[hidden] { display: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="emoji">🐾</div>
    <h1 id="title">Catown Map</h1>
    <p id="message">Tap the “Open Catown Map” button to go to the app.</p>
    <a class="btn" id="openBtn" href="https://catownmap.com/auth-callback">Open Catown Map</a>
  </main>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var isJapanese = (params.get('locale') || navigator.language || '').toLowerCase().startsWith('ja');
    document.documentElement.lang = isJapanese ? 'ja' : 'en';
    document.getElementById('message').textContent = isJapanese
      ? '「ねこまちマップを開く」ボタンをタップしてアプリへ移動してください。'
      : 'Tap the “Open Catown Map” button to go to the app.';
    document.getElementById('openBtn').textContent = isJapanese
      ? 'ねこまちマップを開く'
      : 'Open Catown Map';

    // Keep the HTTPS callback intact. Android's explicit package prevents a
    // different app from claiming the authentication link via a custom scheme.
    // Rebuild from an allowlist, never interpolate input into Intent directives.
    var callback = new URL('https://catownmap.com/auth-callback');
    var token = params.get('token_hash');
    var type = params.get('type');
    var code = params.get('code');
    var valid = false;
    if (params.getAll('token_hash').length === 1 &&
        params.getAll('type').length === 1 && !params.has('code') &&
        /^[A-Za-z0-9_-]{1,2048}$/.test(token || '') &&
        (type === 'signup' || type === 'recovery')) {
      callback.searchParams.set('token_hash', token);
      callback.searchParams.set('type', type);
      valid = true;
    } else if (params.getAll('code').length === 1 && !params.has('token_hash') &&
        /^[A-Za-z0-9_-]{1,2048}$/.test(code || '')) {
      callback.searchParams.set('code', code);
      valid = true;
    }
    var button = document.getElementById('openBtn');
    if (valid) {
      callback.searchParams.set('locale', isJapanese ? 'ja' : 'en');
      button.href = /Android/i.test(navigator.userAgent || '')
        ? 'intent://' + callback.host + callback.pathname + callback.search +
          '#Intent;scheme=https;package=com.catownmap.app;end'
        : callback.href;
    } else {
      button.removeAttribute('href');
      button.hidden = true;
      document.getElementById('message').textContent = isJapanese
        ? '認証情報がありません。メールに戻り、リンクをもう一度開いてください。'
        : 'Authentication information is missing. Return to your email and open the link again.';
    }
    window.history.replaceState(null, '', '/auth-callback');
  })();
</script>
</body>
</html>
